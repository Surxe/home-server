# /etc/systemd/logind.conf.d/home-server.conf
# A closed-lid laptop server must never sleep. Applied on next logind restart/reboot;
# sleep targets are also masked (see bootstrap.sh) for immediate, restart-free protection.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
